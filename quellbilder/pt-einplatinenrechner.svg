<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Icon „Einplatinenrechner“ für das Fremdgerät im Simulationsnetz E3 (Packet Tracer). Selbst gezeichnet, ohne Logo. -->
  <g transform="translate(4 22)">
    <!-- Platine -->
    <rect x="0" y="0" width="120" height="84" rx="7" fill="#1f7a3e" stroke="#0e4a24" stroke-width="2"/>
    <!-- Befestigungslöcher -->
    <g fill="#d9c27a" stroke="#0e4a24" stroke-width="1">
      <circle cx="7" cy="7" r="3.5"/><circle cx="7" cy="77" r="3.5"/>
      <circle cx="91" cy="7" r="3.5"/><circle cx="91" cy="77" r="3.5"/>
    </g>
    <!-- Stiftleiste 2×20 -->
    <rect x="13" y="3" width="72" height="10" rx="1" fill="#222"/>
    <g fill="#d9c27a">
      <circle cx="16" cy="6" r="1.2"/><circle cx="19.5" cy="6" r="1.2"/><circle cx="23" cy="6" r="1.2"/><circle cx="26.5" cy="6" r="1.2"/><circle cx="30" cy="6" r="1.2"/><circle cx="33.5" cy="6" r="1.2"/><circle cx="37" cy="6" r="1.2"/><circle cx="40.5" cy="6" r="1.2"/><circle cx="44" cy="6" r="1.2"/><circle cx="47.5" cy="6" r="1.2"/><circle cx="51" cy="6" r="1.2"/><circle cx="54.5" cy="6" r="1.2"/><circle cx="58" cy="6" r="1.2"/><circle cx="61.5" cy="6" r="1.2"/><circle cx="65" cy="6" r="1.2"/><circle cx="68.5" cy="6" r="1.2"/><circle cx="72" cy="6" r="1.2"/><circle cx="75.5" cy="6" r="1.2"/><circle cx="79" cy="6" r="1.2"/><circle cx="82.5" cy="6" r="1.2"/>
      <circle cx="16" cy="10" r="1.2"/><circle cx="19.5" cy="10" r="1.2"/><circle cx="23" cy="10" r="1.2"/><circle cx="26.5" cy="10" r="1.2"/><circle cx="30" cy="10" r="1.2"/><circle cx="33.5" cy="10" r="1.2"/><circle cx="37" cy="10" r="1.2"/><circle cx="40.5" cy="10" r="1.2"/><circle cx="44" cy="10" r="1.2"/><circle cx="47.5" cy="10" r="1.2"/><circle cx="51" cy="10" r="1.2"/><circle cx="54.5" cy="10" r="1.2"/><circle cx="58" cy="10" r="1.2"/><circle cx="61.5" cy="10" r="1.2"/><circle cx="65" cy="10" r="1.2"/><circle cx="68.5" cy="10" r="1.2"/><circle cx="72" cy="10" r="1.2"/><circle cx="75.5" cy="10" r="1.2"/><circle cx="79" cy="10" r="1.2"/><circle cx="82.5" cy="10" r="1.2"/>
    </g>
    <!-- Leiterbahnen -->
    <g stroke="#2f9a56" stroke-width="1.5" fill="none">
      <path d="M58 46 H86 V30"/><path d="M58 52 H90 V62"/><path d="M32 40 V22 H50"/><path d="M38 58 V72 H60"/>
    </g>
    <!-- Prozessor und Speicher -->
    <rect x="32" y="30" width="26" height="26" rx="2" fill="#2b2b2b" stroke="#111" stroke-width="1"/>
    <rect x="36" y="34" width="18" height="18" rx="1" fill="#3a3a3a"/>
    <rect x="62" y="34" width="14" height="18" rx="1.5" fill="#2b2b2b"/>
    <!-- USB-Buchsen und Ethernet-Buchse am rechten Rand -->
    <g stroke="#7d868c" stroke-width="1">
      <rect x="98" y="2" width="24" height="20" rx="1.5" fill="#c9d1d6"/>
      <rect x="98" y="25" width="24" height="18" rx="1.5" fill="#c9d1d6"/>
      <rect x="98" y="46" width="24" height="18" rx="1.5" fill="#c9d1d6"/>
    </g>
    <g fill="#5a6268">
      <rect x="104" y="6" width="14" height="12" rx="1"/>
      <rect x="104" y="29" width="14" height="4"/><rect x="104" y="36" width="14" height="4"/>
      <rect x="104" y="50" width="14" height="4"/><rect x="104" y="57" width="14" height="4"/>
    </g>
    <!-- Status-LEDs -->
    <circle cx="10" cy="62" r="2.5" fill="#ff5a3c"/><circle cx="10" cy="70" r="2.5" fill="#5dff7a"/>
  </g>
</svg>
